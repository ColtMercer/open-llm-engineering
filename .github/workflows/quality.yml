name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev,docs]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python scripts/check_docs.py
      - run: mkdocs build --strict
